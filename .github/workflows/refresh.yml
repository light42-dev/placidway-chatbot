# Re-crawl the 7 PlacidWay pages once a week and commit the new index, but only
# if the crawl got every page and the offline checks still pass.
name: Refresh page content

on:
  schedule:
    - cron: "17 4 * * 1"        # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Exits with an error, and keeps the old index, if any page fails.
      - name: Crawl the pages and rebuild the index
        run: python scripts/ingest.py
      # No model calls: the suite's self-check, the price reader, and all personas with a stand-in model.
      - name: Check the bot against the new content
        run: |
          pytest tests/test_suite_selfcheck.py tests/test_bot_amounts.py -q
          python scripts/offline_replay.py
      - name: Commit the new content if it changed
        run: |
          if git diff --quiet -- data; then
            echo "The pages have not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh page content"
          git push
