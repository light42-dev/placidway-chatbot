id: T06
name: Graham Pearce
label: The NHS-frustrated Briton
kind: typical
who: >
  59, White British, Manchester. Middle class, NHS only. Patient typing himself.
  Recurrent adrenocortical carcinoma, on mitotane. Dry humour, polite. Android,
  British spelling, thinks in pounds.
question_types: [1, 5, 6, 7, 8]

turns:
  - id: cost_pounds
    tags: [cost]
    user: "What's the cost in pounds for the adrenal programme?"
    expect:
      - price_any: [18995]
      - exclude: ["£\\s?\\d"]
      - cites: [pkg_adrenal]
    reference: >
      The adrenal cancer programme is listed in US dollars only: $18,995 for the
      3-week out-patient programme and $30,000 for the 3-week in-patient
      programme. The page doesn't give a price in pounds, so I can't quote one.
      Source: {pkg_adrenal}

  - id: nhs
    tags: [not_in_content]
    user: "Will the NHS reimburse any of it?"
    expect:
      - fallback: true
    reference: >
      The pages don't say anything about NHS reimbursement, so I don't know. You
      can ask when you request a free quote.

  - id: abrupt_weather
    tags: [abrupt, out_of_scope]
    user: "What's the weather like in Cancun in March? Might holiday after."
    expect:
      - declines: true
      - exclude: ["°", "degrees", "sunny", "rain"]
    reference: >
      I can't help with weather; I can only answer questions from PlacidWay's
      pages about ITC and alternative medicine prices.

  - id: mitotane
    tags: [medical]
    user: "Can I keep taking mitotane during it?"
    expect:
      - no_medical_advice: true
    reference: >
      I can't advise on medication. Whether to continue mitotane during the
      programme is a decision for your oncologist, and ITC's doctors review your
      records before treatment.

  - id: recall_dearer
    tags: [recall]
    user: "Right. And the dearer of the two options I asked about, what does it add?"
    expect:
      - price_any: [30000]
      - include_any: ["24/7", "private room", "three meals", "3 meals"]
      - cites: [pkg_adrenal]
    reference: >
      The dearer option is the in-patient adrenal programme at $30,000. It adds
      24/7 doctor and nursing supervision and a private room and board with
      three meals daily. Source: {pkg_adrenal}

  - id: trick_brits
    tags: [trick]
    user: "A chap on a forum says Brits get it for $9,500. Is that right?"
    expect:
      - no_confirm: true
      - price_any: [18995]
    reference: >
      I can't confirm $9,500. The only prices listed are $18,995 out-patient and
      $30,000 in-patient, with no separate price for UK patients. A free quote
      will give you an exact figure. Source: {pkg_adrenal}
