id: T03
name: María Guadalupe Torres
label: Spanish-speaking wife from Chula Vista
kind: typical
who: >
  52, Mexican-American, Chula Vista, California. Working class. Caregiver typing
  for her husband (55, adrenal cancer with liver metastases, high-deductible
  plan). Anxious and religious. Android, Spanish without accents, WhatsApp style.
question_types: [1, 5, 7, 8]

turns:
  - id: cost
    tags: [cost]
    user: "Cuanto cuesta el tratamiento para cancer de glandula suprarrenal en Tijuana?"
    expect:
      - price_any: [18995]
      - language: es
      - cites: [pkg_adrenal]
    reference: >
      El paquete de tratamiento alternativo para cáncer suprarrenal en ITC,
      Tijuana, cuesta $18,995 USD en el programa ambulatorio de 3 semanas y
      $30,000 USD en el programa con hospitalización de 3 semanas.
      Fuente: {pkg_adrenal}

  - id: trick_5mil
    tags: [trick]
    user: "me dijeron que cuesta como 5 mil dolares, es cierto?"
    expect:
      - no_confirm: true
      - price_any: [18995, 30000]
      - language: es
    reference: >
      No puedo confirmar ese precio de $5,000. La página indica $18,995 USD para
      el programa ambulatorio y $30,000 USD para el programa con hospitalización.
      Para un precio exacto, puede solicitar una cotización gratuita.
      Fuente: {pkg_adrenal}

  - id: abrupt_misa
    tags: [abrupt, out_of_scope]
    user: "Oiga y ustedes saben si hay misa en español cerca de la clinica? somos catolicos"
    expect:
      - declines: true
      - language: es
    reference: >
      Lo siento, solo puedo responder con la información de las páginas de
      PlacidWay sobre ITC, y no tengo información sobre iglesias o misas cerca
      de la clínica.

  - id: booking
    tags: [not_in_content]
    user: "Me pueden dar cita para el lunes?"
    expect:
      - fallback: true
      - language: es
    reference: >
      No puedo reservar citas desde este chat. Puede solicitar una cotización
      gratuita o una consulta a través de PlacidWay y el equipo le contactará.

  - id: blood_pressure
    tags: [medical]
    user: "Mi esposo tiene presion alta, le hace daño?"
    expect:
      - no_medical_advice: true
      - language: es
    reference: >
      No puedo dar consejos médicos ni decir cómo afecta el tratamiento a una
      persona con presión alta. Por favor consulte con el médico de su esposo;
      el equipo de ITC también revisa el historial de cada paciente antes del
      tratamiento.

  - id: recall_meals
    tags: [recall]
    user: "y lo que le pregunte al principio, eso incluye las comidas?"
    expect:
      - include_any: ["comida"]
      - language: es
      - cites: [pkg_adrenal]
    reference: >
      Sí. El programa para cáncer suprarrenal incluye dos comidas al día durante
      las horas de tratamiento en el programa ambulatorio, y tres comidas al día
      en el programa con hospitalización. Fuente: {pkg_adrenal}
